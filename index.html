<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Document</title>
  </head>

  <body>
    <div class="container">
      <h1>Find Your Music</h1>
      <div class="search-box">
        <input type="text" placeholder="Search for an album or song..." />
        <button>Search</button>
      </div>
      <div class="radio-group">
        <input type="radio" id="album" name="searchType" checked />
        <label for="album">Album</label>
        <input type="radio" id="song" name="searchType" />
        <label for="song">Song</label>
      </div>

      <div class="album-cards">
      </div>
      <div class="song-list">
      </div>
      <div class="playback-bar">
        <div class="playback-song-info">
          <img
            class="song-cover"
            src=""
            alt=""
          />
          <div>
            <span class="song-title"></span>
            <span class="song-artist"></span>
          </div>
        </div>
        <div class="control">
          <div class="playback-controls">
            <button id="shuffle"><i class="fa-solid fa-shuffle"></i></button>
            <button id="prev"><i class="fa-solid fa-backward-step"></i></button>
            <button id="play-pause"><i class="fa-solid fa-play play"></i></button>
            <button id="next"><i class="fa-solid fa-forward-step"></i></button>
            <button id="repeat">
              <i class="fa-solid fa-repeat"></i>
            </button>
          </div>
          <div class="player-progress" id="player-progress">
            <div class="progress" id="progress"></div>
            <div class="music-duration">
              <span id="current-time">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
        </div>
        <div class="volume-control">
          <i class="fa-solid fa-volume-high"></i>
          <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </div>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
